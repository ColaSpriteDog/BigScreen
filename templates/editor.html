<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大屏数据编辑</title>
  <link rel="stylesheet" href="/static/vendor/element-plus.css">
  <link rel="stylesheet" href="/static/css/editor.css?v=20261123-line-settings">
  <script defer src="/static/vendor/vue.global.prod.js"></script>
  <script defer src="/static/vendor/element-plus.js"></script>
  <script defer src="/static/vendor/element-plus-zh-cn.js"></script>
  <script defer src="/static/js/model.js?v=20261123-production-import"></script>
  <script defer src="/static/js/api.js?v=20261123-import"></script>
  <script defer src="/static/js/editor.js?v=20261123-oee-import"></script>
</head>
<body>
  <div id="bootStatus" role="status">正在加载编辑页面…</div>
  <div id="editorApp" v-cloak>
    <aside class="editor-sidebar">
      <div class="sidebar-brand"><img src="/assets/gulian-logo.png" alt="固联轻量化" width="136" height="35"></div>
      <nav class="sidebar-nav" role="tablist" aria-label="编辑模块" aria-orientation="vertical">
        <button v-for="item in modules" :key="item.id" type="button" class="module-tab" role="tab" :id="'tab-'+item.id" :aria-controls="'panel-'+item.id" :aria-selected="activeTab===item.id" :tabindex="activeTab===item.id?0:-1" :disabled="loading||saving" @click="switchModule(item.id)" @keydown="navigateModules($event,item.id)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="item.icon"></path></svg><span>{{item.label}}</span>
        </button>
      </nav>
      <a href="/screen" target="_blank" rel="noopener" class="sidebar-preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M21 3 11 13M10 4H4v16h16v-6"></path></svg><span>打开大屏</span></a>
    </aside>
    <div class="editor-workspace">
      <header class="editor-header">
        <h1>{{currentModule.label}}</h1>
        <div class="header-actions"><span class="saved-label">{{savedLabel}}</span><el-button class="reload-button" aria-label="重新加载" title="重新加载" @click="reloadCurrent" :disabled="loading||saving"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v5h-5M20 10a8 8 0 1 0-1 8"></path></svg></el-button><span v-if="currentEmployee" class="account-name">{{currentEmployee.name}}</span><el-button v-if="currentEmployee" text @click="logout" :disabled="loading||saving">退出登录</el-button><a v-else href="/login" target="_blank" rel="noopener" class="relogin-link">重新登录</a></div>
      </header>
      <main class="editor-main" v-loading="loading" :inert="loading||saving">
      <fieldset class="editor-fields" :disabled="loading||saving||!moduleReady" aria-label="当前模块数据">
      <el-alert v-if="errorMessage" ref="requestError" :title="errorMessage" type="error" show-icon :closable="false" class="request-error" role="alert" tabindex="-1"></el-alert>
      <template v-if="ready">
        <!-- 仓库文件仅用于库存与出货模块，避免在生产日报页面误选仓库解析流程。 -->
        <div v-show="activeTab==='inventory'||activeTab==='sales'" class="inventory-import-toolbar warehouse-import-toolbar"><el-date-picker v-model="warehouseMonth" type="month" value-format="YYYY-MM" format="YYYY 年 MM 月" :clearable="false" aria-label="仓库日报出货月份"></el-date-picker><el-button type="primary" @click="$refs.warehouseFile.click()" :disabled="loading||saving||!moduleReady||!warehouseMonth" data-testid="import-warehouse">导入仓库日报</el-button><input ref="warehouseFile" type="file" accept=".xls,.xlsx" hidden aria-label="仓库日报 Excel 文件" @change="previewWarehouseFile"></div>
        <section v-show="activeTab==='production'" id="panel-production" role="tabpanel" aria-labelledby="tab-production" data-testid="production-panel">
          <div class="period-toolbar"><div class="period-controls"><el-button class="date-step" aria-label="前一天" title="前一天" @click="stepDate(-1)" :disabled="loading||saving"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m14 8-4 4 4 4"></path></svg></el-button><el-date-picker v-model="selectedDate" type="date" value-format="YYYY-MM-DD" format="YYYY-MM-DD" :clearable="false" @change="changeDate" aria-label="日报日期"></el-date-picker><el-button class="date-step" aria-label="后一天" title="后一天" @click="stepDate(1)" :disabled="loading||saving||selectedDate>=businessDate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m10 8 4 4-4 4"></path></svg></el-button><el-button @click="goToday" :disabled="selectedDate===businessDate">今天</el-button></div><span class="weekday-label">{{selectedWeekday}}</span></div>
          <div class="inventory-import-toolbar production-import-toolbar"><el-date-picker v-model="productionImportMonth" type="month" value-format="YYYY-MM" format="YYYY-MM" :clearable="false" aria-label="生产导入月份"></el-date-picker><el-button type="primary" @click="$refs.productionFile.click()" :disabled="loading||saving||!moduleReady" data-testid="import-production">导入生产日报推移图</el-button><input ref="productionFile" type="file" accept=".xls,.xlsx" hidden aria-label="生产日报 Excel 文件" @change="previewProductionFile"></div>
          <div class="editor-card">
            <el-table :data="production.lines" row-key="id" class="editable-table" data-testid="production-table" :row-class-name="scope=>rowClass('production','lines',scope.row)" :cell-class-name="scope=>cellClass('production','lines',scope)">
              <el-table-column prop="code" label="编号" width="60"></el-table-column><el-table-column prop="name" label="产线" min-width="190"><template #default="scope"><span class="line-name"><i class="line-dot" :style="{backgroundColor:lineColor(scope.row.id)}" aria-hidden="true"></i><strong>{{scope.row.name}}</strong></span></template></el-table-column>
              <el-table-column label="单位" width="65"><template #default="scope">{{scope.row.unit}}</template></el-table-column>
              <el-table-column label="标准产量" min-width="120"><template #default="scope"><span class="number-text">{{fmt(scope.row.standard_qty)}}</span></template></el-table-column>
              <el-table-column prop="planned_hours" label="计划生产时长（小时）" min-width="175"><template #default="scope"><el-input-number v-model="scope.row.planned_hours" :min="0" :max="24" :precision="2" :step="0.5" :controls="false" @change="markDirty('production')" :aria-label="'计划生产时长 '+scope.row.name" :data-testid="'planned-hours-'+scope.row.id"></el-input-number></template></el-table-column>
              <el-table-column prop="actual_qty" label="今日产量" min-width="160"><template #default="scope"><el-input-number v-model="scope.row.actual_qty" :min="0" :max="1000000000000" :precision="scope.row.unit==='米'?undefined:0" :controls="false" @change="markDirty('production')" :aria-label="'今日产量 '+scope.row.name" :data-testid="'actual-'+scope.row.id"></el-input-number></template></el-table-column>
              <el-table-column prop="defect_qty" label="不良数量" min-width="150"><template #default="scope"><el-input-number v-model="scope.row.defect_qty" :min="0" :max="1000000000000" :precision="scope.row.unit==='米'?undefined:0" :controls="false" @change="markDirty('production')" :aria-label="'不良数量 '+scope.row.name" :data-testid="'defect-'+scope.row.id"></el-input-number></template></el-table-column>
              <el-table-column label="不良率" width="90"><template #default="scope"><span class="number-text">{{percent(rate(scope.row.defect_qty,scope.row.actual_qty))}}</span></template></el-table-column>
              <el-table-column prop="abnormal_hours" label="异常停机工时（小时）" min-width="175"><template #default="scope"><el-input-number v-model="scope.row.abnormal_hours" :min="0" :max="scope.row.planned_hours" :precision="2" :controls="false" @change="markDirty('production')" :aria-label="'异常停机工时 '+scope.row.name" :data-testid="'abnormal-hours-'+scope.row.id"></el-input-number></template></el-table-column>
              <el-table-column label="当前状态" width="115"><template #default="scope"><el-tag class="status-pill" :type="scope.row.status==='running'?'success':scope.row.status==='fault'?'danger':'warning'" effect="light">{{scope.row.status_label}}</el-tag></template></el-table-column>
              <el-table-column label="运行率" width="105"><template #default="scope"><strong class="number-text">{{percent(scope.row.runtime_rate)}}</strong></template></el-table-column>
              <el-table-column label="停机操作" min-width="130"><template #default="scope"><el-button v-if="scope.row.open_downtime_id" type="success" plain size="small" @click="finishStop(scope.row)" :disabled="selectedDate!==businessDate||saving">恢复运行</el-button><el-dropdown v-else-if="scope.row.status==='running'" @command="kind=>startStop(scope.row,kind)" :disabled="selectedDate!==businessDate||saving"><el-button plain size="small" :disabled="selectedDate!==businessDate||saving">开始停机 ▾</el-button><template #dropdown><el-dropdown-menu><el-dropdown-item command="stopped">停机</el-dropdown-item><el-dropdown-item command="maintenance">维护</el-dropdown-item><el-dropdown-item command="fault">故障</el-dropdown-item></el-dropdown-menu></template></el-dropdown><el-button v-else plain size="small" @click="scrollToDowntimes">修改时段</el-button></template></el-table-column>
                        <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table>
          </div>
          <div class="section-toolbar"><div class="section-heading"><h2>全局生产指标</h2></div><span class="derived-metric">综合达成率 <strong>{{percent(rate(productionTotals.actual_qty,productionTotals.planned_qty))}}</strong></span></div>
          <el-form label-position="top" class="metric-form" @submit.prevent>
            <el-form-item label="总计划产量（件）"><span class="number-text" data-testid="overview-planned">{{fmt(productionTotals.planned_qty)}}</span></el-form-item>
            <el-form-item label="实际完成（件）"><span class="number-text" data-testid="overview-actual">{{fmt(productionTotals.actual_qty)}}</span></el-form-item>
            <el-form-item label="设备综合效率（%）"><span class="number-text" data-testid="overview-oee">{{percent(productionTotals.oee_percent)}}</span></el-form-item>
            <el-form-item label="品质合格率（%）"><span class="number-text" data-testid="overview-quality">{{percent(productionTotals.quality_percent)}}</span></el-form-item>
            <el-form-item label="平均产出（件/小时）"><span class="number-text" data-testid="overview-average">{{fmt(productionTotals.average_output)}}</span></el-form-item>
          </el-form>
          <div class="section-toolbar" id="downtimeSection"><h2>停机时段</h2><el-button @click="addDowntime"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>新增时段</el-button></div>
          <div class="editor-card"><el-table :data="production.downtimes" row-key="_key" class="editable-table" empty-text="暂无停机记录" data-testid="downtime-table" :row-class-name="scope=>rowClass('production','downtimes',scope.row)" :cell-class-name="scope=>cellClass('production','downtimes',scope)">
            <el-table-column prop="line_id" label="产线" min-width="170"><template #default="scope"><el-select v-model="scope.row.line_id" @change="markDirty('production')" aria-label="停机产线"><el-option v-for="line in production.lines" :key="line.id" :label="line.name" :value="line.id"></el-option></el-select></template></el-table-column>
            <el-table-column prop="start_at" label="开始时间" min-width="210"><template #default="scope"><el-date-picker v-model="scope.row.start_at" type="datetime" value-format="YYYY-MM-DDTHH:mm:ss" format="YYYY-MM-DD HH:mm" :id="'stop-start-'+scope.$index" @change="markDirty('production')" aria-label="停机开始时间"></el-date-picker></template></el-table-column>
            <el-table-column prop="end_at" label="结束时间" min-width="210"><template #default="scope"><el-date-picker v-model="scope.row.end_at" type="datetime" value-format="YYYY-MM-DDTHH:mm:ss" format="YYYY-MM-DD HH:mm" :id="'stop-end-'+scope.$index" placeholder="未结束" @change="markDirty('production')" aria-label="停机结束时间"></el-date-picker></template></el-table-column>
            <el-table-column prop="kind" label="原因" min-width="110"><template #default="scope"><el-select v-model="scope.row.kind" @change="markDirty('production')" aria-label="停机原因"><el-option label="停机" value="stopped"></el-option><el-option label="维护" value="maintenance"></el-option><el-option label="故障" value="fault"></el-option></el-select></template></el-table-column>
            <el-table-column prop="note" label="备注" min-width="160"><template #default="scope"><el-input v-model="scope.row.note" maxlength="200" @input="markDirty('production')" aria-label="停机备注"></el-input></template></el-table-column>
            <el-table-column label="操作" width="80"><template #default="scope"><el-button link type="danger" @click="removeRow('downtimes',scope.$index)">删除</el-button></template></el-table-column>
                      <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table></div>
        </section>
        <section v-show="activeTab==='inventory'" id="panel-inventory" role="tabpanel" aria-labelledby="tab-inventory" data-testid="inventory-panel">
          <div class="section-toolbar"><div class="heading-with-total"><h2>原材料库存</h2><span>{{rawSummary}}</span><span v-if="rawZeroCount" class="zero-stock-badge">{{rawZeroCount}}项零库存</span></div><el-button @click="addRaw" data-testid="add-raw"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>新增原材料</el-button></div>
          <div class="editor-card"><el-table :data="inventory.raw" row-key="_key" class="editable-table" empty-text="暂无原材料记录" data-testid="raw-editor-table" :row-class-name="scope=>rowClass('inventory','raw',scope.row)" :cell-class-name="scope=>cellClass('inventory','raw',scope)">
            <el-table-column prop="material" label="物料" min-width="100"><template #default="scope"><el-input v-model="scope.row.material" maxlength="30" @input="markDirty('inventory')" aria-label="原材料物料" :data-testid="'raw-material-'+scope.$index"></el-input></template></el-table-column>
            <el-table-column prop="warehouse" label="仓库" min-width="140"><template #default="scope"><el-select v-model="scope.row.warehouse" filterable allow-create default-first-option @change="markDirty('inventory')" aria-label="原材料仓库"><el-option v-for="name in rawWarehouses" :key="name" :value="name" :label="name"></el-option></el-select></template></el-table-column>
            <el-table-column prop="specification" label="规格" min-width="160"><template #default="scope"><el-input v-model="scope.row.specification" maxlength="80" @input="markDirty('inventory')" aria-label="原材料规格" :data-testid="'raw-spec-'+scope.$index"></el-input></template></el-table-column>
            <el-table-column prop="position" label="部位" min-width="95"><template #default="scope"><el-input v-model="scope.row.position" maxlength="30" @input="markDirty('inventory')" aria-label="原材料部位" :data-testid="'raw-position-'+scope.$index"></el-input></template></el-table-column>
            <el-table-column prop="quantity" label="库存" min-width="100"><template #default="scope"><el-input-number v-model="scope.row.quantity" :min="0" :precision="2" :controls="false" @change="markDirty('inventory')" aria-label="原材料库存" :data-testid="'raw-quantity-'+scope.$index"></el-input-number></template></el-table-column>
            <el-table-column prop="unit" label="单位" min-width="90"><template #default="scope"><el-select v-model="scope.row.unit" filterable allow-create @change="markDirty('inventory')" aria-label="原材料单位"><el-option v-for="unit in ['卷','张','个','千克']" :key="unit" :value="unit" :label="unit"></el-option></el-select></template></el-table-column>
            <el-table-column prop="weight_kg" label="重量（吨）" min-width="115"><template #default="scope"><el-input-number :model-value="weightTonnes(scope.row.weight_kg)" :min="0" :precision="5" :controls="false" @update:model-value="value=>updateWeight(scope.row,value)" aria-label="原材料重量"></el-input-number></template></el-table-column>
            <el-table-column label="状态" width="100"><template #default="scope"><el-tag v-if="scope.row.quantity!==null&&scope.row.quantity!==undefined" class="status-pill" :type="scope.row.quantity===0?'danger':'success'">{{scope.row.quantity===0?'零库存':'有库存'}}</el-tag><span v-else>—</span></template></el-table-column>
            <el-table-column prop="cuttable_qty" label="可切（件）" min-width="105"><template #default="scope"><el-input-number v-model="scope.row.cuttable_qty" :min="0" :precision="0" :controls="false" @change="markDirty('inventory')" aria-label="可切件数" :data-testid="'raw-cuttable-'+scope.$index"></el-input-number></template></el-table-column>
            <el-table-column label="操作" width="105"><template #default="scope"><el-button link @click="copyRow('raw',scope.$index)">复制</el-button><el-button link type="danger" @click="removeRow('raw',scope.$index)">删除</el-button></template></el-table-column>
                      <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table></div>
          <div class="section-toolbar"><div class="heading-with-total"><h2>半成品库存</h2><span>{{semiSummary}}</span></div><el-button @click="addSemi"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>新增半成品</el-button></div>
          <div class="editor-card"><el-table :data="inventory.semi" row-key="_key" class="editable-table" empty-text="暂无半成品记录" data-testid="semi-editor-table" :row-class-name="scope=>rowClass('inventory','semi',scope.row)" :cell-class-name="scope=>cellClass('inventory','semi',scope)">
            <el-table-column prop="category" label="类别" width="110"><template #default="scope"><el-select v-model="scope.row.category" @change="markDirty('inventory')" aria-label="半成品类别"><el-option v-for="category in ['左件','右件','其他']" :key="category" :value="category" :label="category"></el-option></el-select></template></el-table-column>
            <el-table-column prop="material" label="物料" min-width="170"><template #default="scope"><el-input v-model="scope.row.material" maxlength="30" @input="markDirty('inventory')" aria-label="半成品物料"></el-input></template></el-table-column>
            <el-table-column prop="warehouse" label="仓库" min-width="150"><template #default="scope"><el-select v-model="scope.row.warehouse" filterable allow-create @change="markDirty('inventory')" aria-label="半成品仓库"><el-option v-for="name in semiWarehouses" :key="name" :value="name" :label="name"></el-option></el-select></template></el-table-column>
            <el-table-column prop="specification" label="规格" min-width="140"><template #default="scope"><el-input v-model="scope.row.specification" maxlength="30" @input="markDirty('inventory')" aria-label="半成品规格"></el-input></template></el-table-column>
            <el-table-column prop="quantity" label="库存" min-width="140"><template #default="scope"><el-input-number v-model="scope.row.quantity" :min="0" :precision="0" :controls="false" @change="markDirty('inventory')" aria-label="半成品库存"></el-input-number></template></el-table-column>
            <el-table-column prop="unit" label="单位" width="100"><template #default="scope"><el-select v-model="scope.row.unit" filterable allow-create @change="markDirty('inventory')" aria-label="半成品单位"><el-option label="件" value="件"></el-option></el-select></template></el-table-column>
            <el-table-column label="操作" width="110"><template #default="scope"><el-button link @click="copyRow('semi',scope.$index)">复制</el-button><el-button link type="danger" @click="removeRow('semi',scope.$index)">删除</el-button></template></el-table-column>
                      <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table></div>
        </section>
        <section v-show="activeTab==='sales'" id="panel-sales" role="tabpanel" aria-labelledby="tab-sales" data-testid="sales-panel">
          <div class="period-toolbar"><record-audit :meta="sales._audit" :timezone="timezone" prefix="订单最后修改："></record-audit><el-date-picker v-model="selectedMonth" type="month" value-format="YYYY-MM" format="YYYY 年 MM 月" :clearable="false" @change="changeMonth" aria-label="出货月份"></el-date-picker></div>
          <div class="sales-summary"><el-form-item label="本月订单量（件）" class="editor-card"><el-input-number v-model="sales.order_qty" :min="0" :precision="0" :controls="false" @change="markDirty('sales')" aria-label="本月订单量" data-testid="order-input" :class="{'is-changed':hasChanged('sales',null,'order_qty')}"></el-input-number></el-form-item><div class="editor-card"><span>累计出货（件）</span><strong>{{fmt(shippedTotal)}}</strong></div><div class="editor-card"><span>出货达成率</span><strong class="green-text">{{percent(rate(shippedTotal,sales.order_qty))}}</strong></div></div>
          <div class="section-toolbar"><h2>件号出货明细</h2><div class="toolbar-actions"><el-input v-model="partSearch" placeholder="搜索件号" clearable aria-label="搜索件号" class="part-search"></el-input><el-button @click="addShipment" data-testid="add-shipment"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>新增件号</el-button></div></div>
          <div class="editor-card"><el-table :data="filteredShipments" row-key="_key" class="editable-table" empty-text="暂无出货记录" data-testid="shipment-editor-table" :row-class-name="scope=>rowClass('sales','items',scope.row)" :cell-class-name="scope=>cellClass('sales','items',scope)">
            <el-table-column type="index" label="序号" width="65"></el-table-column><el-table-column prop="shipment_date" label="出库日期" min-width="170"><template #default="scope"><el-date-picker v-model="scope.row.shipment_date" type="date" value-format="YYYY-MM-DD" format="YYYY-MM-DD" :clearable="false" @change="markDirty('sales')" aria-label="出库日期" :data-testid="'shipment-date-'+scope.$index"></el-date-picker></template></el-table-column><el-table-column prop="part_no" label="件号" min-width="160"><template #default="scope"><el-input v-model="scope.row.part_no" maxlength="40" @input="markDirty('sales')" aria-label="件号" :data-testid="'part-'+scope.$index"></el-input></template></el-table-column>
            <el-table-column prop="name" label="名称" min-width="180"><template #default="scope"><el-input v-model="scope.row.name" maxlength="80" @input="markDirty('sales')" aria-label="出货名称" :data-testid="'shipment-name-'+scope.$index"></el-input></template></el-table-column>
            <el-table-column prop="quantity" label="数量（件）" min-width="160"><template #default="scope"><el-input-number v-model="scope.row.quantity" :min="0" :precision="0" :controls="false" @change="markDirty('sales')" aria-label="件号出货数量" :data-testid="'shipment-quantity-'+scope.$index"></el-input-number></template></el-table-column>
            <el-table-column label="占本月出货" min-width="200"><template #default="scope"><div class="shipment-share" role="meter" :aria-label="'件号出货占比 '+scope.row.part_no" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="rate(scope.row.quantity,shippedTotal)||0" :aria-valuetext="percent(rate(scope.row.quantity,shippedTotal))"><span class="share-track" aria-hidden="true"><span class="share-fill" :style="{width:Math.max(0,Math.min(100,rate(scope.row.quantity,shippedTotal)||0))+'%'}"></span></span><span class="number-text">{{percent(rate(scope.row.quantity,shippedTotal))}}</span></div></template></el-table-column>
            <el-table-column label="操作" width="90"><template #default="scope"><el-button link type="danger" @click="removeShipment(scope.row)">删除</el-button></template></el-table-column>
                      <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table></div>
        </section>
        <section v-show="activeTab==='settings'" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" data-testid="settings-panel">
          <div class="section-toolbar"><h2>业务设置</h2><record-audit :meta="settingsForm._audit" :timezone="timezone" prefix="最后修改："></record-audit></div>
          <el-form label-position="top" class="settings-form editor-card" @submit.prevent><el-form-item label="业务时区" :class="{'is-changed':hasChanged('settings',null,'timezone')}"><el-select v-model="settingsForm.timezone" filterable allow-create @change="markDirty('settings')" aria-label="业务时区"><el-option label="中国标准时间（Asia/Shanghai）" value="Asia/Shanghai"></el-option><el-option label="底特律（America/Detroit）" value="America/Detroit"></el-option><el-option label="UTC" value="UTC"></el-option></el-select></el-form-item><el-form-item label="安全生产起算日期" :class="{'is-changed':hasChanged('settings',null,'safety_start_date')}"><el-date-picker v-model="settingsForm.safety_start_date" type="date" value-format="YYYY-MM-DD" @change="markDirty('settings')" aria-label="安全生产起算日期" id="safety-date" data-testid="safety-date"></el-date-picker></el-form-item></el-form>
          <div class="section-toolbar"><h2>产线配置</h2><span class="trend-selection-count">{{trendLineCount}} 条已选入趋势图</span></div><div class="editor-card"><el-table :data="settingsForm.lines" row-key="id" class="editable-table" data-testid="line-settings-table" :row-class-name="scope=>rowClass('settings','lines',scope.row)" :cell-class-name="scope=>cellClass('settings','lines',scope)"><el-table-column prop="code" label="编号" width="90"></el-table-column><el-table-column prop="name" label="产线名称" min-width="230"><template #default="scope"><div class="line-name-input"><i class="line-dot" :style="{backgroundColor:lineColor(scope.row.id)}" aria-hidden="true"></i><el-input v-model="scope.row.name" maxlength="20" @input="markDirty('settings')" :aria-label="'产线名称 '+scope.row.code"></el-input></div></template></el-table-column><el-table-column prop="standard_qty" label="标准日产量" min-width="200"><template #default="scope"><el-input-number v-model="scope.row.standard_qty" :min="0" :precision="scope.row.id===1?undefined:0" :controls="false" @change="markDirty('settings')" :aria-label="'标准日产量 '+scope.row.code"></el-input-number><span>{{scope.row.id===1?'（米）':'（件）'}}</span></template></el-table-column><el-table-column prop="show_in_trend" label="显示到趋势图" width="155" align="center"><template #default="scope"><el-checkbox v-model="scope.row.show_in_trend" @change="markDirty('settings')" :aria-label="'趋势图显示产线 '+scope.row.code" :data-testid="'trend-toggle-'+scope.row.id"></el-checkbox></template></el-table-column>            <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table></div>
          <div class="section-toolbar"><h2>独立工序状态</h2></div><div class="process-settings"><div v-for="process in settingsForm.processes" :key="process.id" class="editor-card process-setting"><img :src="process.image_path" alt="" width="90" height="70"><strong>{{process.name}}</strong><el-select v-model="process.manual_status" :class="{'is-changed':hasChanged('settings','processes','manual_status',process)}" @change="markDirty('settings')" :aria-label="process.name+'状态'"><el-option label="正常" value="normal"></el-option><el-option label="停机" value="stopped"></el-option><el-option label="维护" value="maintenance"></el-option><el-option label="故障" value="fault"></el-option></el-select><div class="process-attribution"><record-audit :meta="process._audit" :timezone="timezone" prefix="最后修改："></record-audit></div></div></div>
        </section>
        <section v-show="activeTab==='employees'" id="panel-employees" role="tabpanel" aria-labelledby="tab-employees" data-testid="employees-panel">
          <div class="section-toolbar"><h2>员工账号</h2><el-button @click="addEmployee" data-testid="add-employee">新增员工</el-button></div>
          <div class="editor-card"><el-table :data="employees.items" row-key="_key" class="editable-table" empty-text="暂无员工" data-testid="employees-table" :row-class-name="scope=>rowClass('employees','items',scope.row)" :cell-class-name="scope=>cellClass('employees','items',scope)">
            <el-table-column prop="name" label="姓名" min-width="160"><template #default="scope"><el-input v-model="scope.row.name" maxlength="40" @input="markDirty('employees')" :aria-label="'员工姓名 '+(scope.$index+1)"></el-input></template></el-table-column>
            <el-table-column prop="username" label="登录账号" min-width="180"><template #default="scope"><el-input v-model="scope.row.username" maxlength="40" autocomplete="off" @input="markDirty('employees')" :aria-label="'登录账号 '+(scope.$index+1)"></el-input></template></el-table-column>
            <el-table-column prop="password" label="密码" min-width="210"><template #default="scope"><el-input v-model="scope.row.password" type="password" show-password maxlength="128" autocomplete="new-password" :placeholder="scope.row.id?'留空保留原密码':'设置登录密码'" @input="markDirty('employees')" :aria-label="'员工密码 '+(scope.$index+1)"></el-input></template></el-table-column>
            <el-table-column prop="enabled" label="状态" width="135"><template #default="scope"><el-switch v-model="scope.row.enabled" inline-prompt active-text="启用" inactive-text="停用" :disabled="scope.row.id===currentEmployee?.id" @change="markDirty('employees')" :aria-label="'启用员工 '+(scope.$index+1)"></el-switch></template></el-table-column>
            <el-table-column label="操作" width="100"><template #default="scope"><span v-if="scope.row.id===currentEmployee?.id" class="current-account">当前账号</span><el-button v-else link type="danger" @click="removeEmployee(scope.row)" :aria-label="'删除员工 '+(scope.$index+1)">删除</el-button></template></el-table-column>
                      <el-table-column label="最后修改" width="195"><template #default="scope"><record-audit :meta="scope.row._audit" :timezone="timezone"></record-audit></template></el-table-column>
</el-table></div>
        </section>
      </template>
      </fieldset>
      </main>
    </div>
    <footer class="editor-savebar" data-testid="save-bar">
      <span class="save-status" :class="{dirty:isDirty}" role="status" data-testid="save-status">{{saveStatusLabel}}</span>
      <div class="savebar-actions"><el-button @click="reloadCurrent" :disabled="loading||saving||!isDirty">放弃修改</el-button><el-button type="primary" @click="saveModule" :loading="saving" :disabled="loading||!moduleReady" data-testid="save-button"><svg v-if="!saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3h1ZM7 3v6h10V3M7 21v-8h10v8"></path></svg><span>{{currentModule.saveLabel}}</span></el-button></div>
    </footer>
    <el-dialog v-model="warehouseDialogVisible" title="仓库日报导入预览" class="inventory-import-dialog warehouse-import-dialog" width="min(1100px, calc(100vw - 24px))" :close-on-click-modal="false" :close-on-press-escape="!saving" :show-close="!saving" :before-close="done=>{if(!saving)done()}" @closed="clearWarehouseImport">
      <template v-if="warehouseImport">
        <p class="import-source">{{warehouseImport.filename}} · 出货月份 {{warehouseImport.month}}</p>
        <el-alert v-if="warehouseImport.error" ref="warehouseError" :title="warehouseImport.error" type="error" :closable="false" show-icon></el-alert>
        <el-alert title="确认后同时替换全部库存和所选月份出货明细，包括对应的未保存草稿；保留订单量和其他月份数据。重复件号逐条保留，不合并。" type="warning" :closable="false" show-icon></el-alert>
        <p class="import-source">读取“剩余数量”和 Excel 已保存的公式结果。请先在 Excel 中重新计算并保存文件；空白重量、可切数量保持为空，后台不保存上传文件。</p>
        <h3>原材料 {{warehouseImport.inventory.raw.length}} 条 · {{stockSummary(warehouseImport.inventory.raw)}}</h3>
        <el-table :data="warehouseImport.inventory.raw" max-height="200" empty-text="没有原材料记录" data-testid="import-raw-preview">
          <el-table-column prop="source_row" label="源行" width="65"></el-table-column><el-table-column prop="material" label="物料" min-width="80"></el-table-column><el-table-column prop="position" label="部位" min-width="90"></el-table-column><el-table-column prop="specification" label="规格" min-width="170"></el-table-column><el-table-column prop="quantity" label="库存" width="90"></el-table-column><el-table-column prop="unit" label="单位" width="65"></el-table-column><el-table-column label="重量（吨）" min-width="110"><template #default="scope">{{fmtWeight(scope.row.weight_kg)}}</template></el-table-column><el-table-column label="可切（件）" min-width="100"><template #default="scope">{{fmt(scope.row.cuttable_qty)}}</template></el-table-column>
        </el-table>
        <h3>半成品 {{warehouseImport.inventory.semi.length}} 条 · {{stockSummary(warehouseImport.inventory.semi)}}</h3>
        <el-table :data="warehouseImport.inventory.semi" max-height="200" empty-text="没有半成品记录" data-testid="import-semi-preview">
          <el-table-column prop="source_row" label="源行" width="65"></el-table-column><el-table-column prop="category" label="类别" width="90"></el-table-column><el-table-column prop="material" label="物料" min-width="170"></el-table-column><el-table-column prop="specification" label="规格" min-width="100"></el-table-column><el-table-column prop="quantity" label="库存" width="100"></el-table-column><el-table-column prop="unit" label="单位" width="70"></el-table-column>
        </el-table>
        <h3>出货明细 {{warehouseImport.shipments.items.length}} 条 · {{fmt(warehouseImport.shipments.shipped_qty)}}（件）</h3>
        <el-table :data="warehouseImport.shipments.items" max-height="240" data-testid="import-shipment-preview">
          <el-table-column prop="source_row" label="源行" width="65"></el-table-column><el-table-column prop="shipment_date" label="出库日期" min-width="120"></el-table-column><el-table-column prop="part_no" label="零件号" min-width="140"></el-table-column><el-table-column prop="name" label="名称" min-width="160"></el-table-column><el-table-column prop="quantity" label="数量（件）" min-width="110"></el-table-column>
        </el-table>
      </template>
      <template #footer><el-button @click="warehouseDialogVisible=false" :disabled="saving">{{warehouseImport?.saved?'关闭':'取消'}}</el-button><el-button type="primary" @click="confirmWarehouseImport" :loading="saving" :disabled="!warehouseImport||warehouseImport.saved||loading" data-testid="confirm-warehouse-import">确认导入</el-button></template>
    </el-dialog>
    <el-dialog v-model="productionDialogVisible" title="生产日报导入预览" class="inventory-import-dialog" width="min(1100px, calc(100vw - 24px))" :close-on-click-modal="false" :close-on-press-escape="!saving" :show-close="!saving">
      <template v-if="productionImport">
        <p class="import-source">{{productionImport.filename}} · {{productionImport.month}}</p>
        <p class="import-source">C列为1日，按所选月份读取。空白不覆盖已有记录；仅导入产量、报废量及标准产量，计划时长和停机记录保留。</p>
        <el-table :data="productionImport.standards" size="small" data-testid="production-standard-preview"><el-table-column prop="name" label="产线"></el-table-column><el-table-column prop="unit" label="单位" width="80"></el-table-column><el-table-column prop="standard_qty" label="更新标准日产量" width="150"><template #default="scope">{{fmt(scope.row.standard_qty)}}</template></el-table-column></el-table>
        <el-table ref="productionImportTable" :data="productionImport.items" max-height="300" :row-key="row=>row.date+'-'+row.line_id" @selection-change="selectProductionImport" data-testid="production-import-preview">
          <el-table-column type="selection" width="45" :selectable="productionImportSelectable"></el-table-column><el-table-column prop="date" label="日期" width="115"></el-table-column><el-table-column prop="name" label="产线" min-width="145"></el-table-column><el-table-column prop="unit" label="单位" width="60"></el-table-column>
          <el-table-column label="产量" min-width="110"><template #default="scope">{{fmt(scope.row.actual_qty)}}</template></el-table-column><el-table-column label="报废" min-width="90"><template #default="scope">{{fmt(scope.row.defect_qty)}}</template></el-table-column>
          <el-table-column label="工时（小时）" width="120"><template #default="scope">{{fmt(scope.row.planned_hours)}}</template></el-table-column><el-table-column label="异常停机（小时）" width="150"><template #default="scope">{{fmt(scope.row.abnormal_hours)}}</template></el-table-column>
          <el-table-column label="已有产量 / 报废" min-width="140"><template #default="scope">{{fmt(scope.row.previous_actual)}} / {{fmt(scope.row.previous_defect)}}</template></el-table-column><el-table-column label="已有工时 / 停机" min-width="150"><template #default="scope">{{fmt(scope.row.previous_hours)}} / {{fmt(scope.row.previous_abnormal)}}</template></el-table-column><el-table-column label="状态" min-width="240"><template #default="scope">{{scope.row.warnings?.length?scope.row.warnings.join('；'):scope.row.future?'未来日期':scope.row.conflict?'存在差异':'可导入'}}</template></el-table-column>
        </el-table>
        <el-checkbox v-model="productionOverwrite" :disabled="saving">覆盖所选记录中已有的不同数量和工时</el-checkbox>
        <el-alert v-if="errorMessage" :title="errorMessage" type="error" :closable="false"></el-alert>
      </template>
      <template #footer><el-button @click="productionDialogVisible=false" :disabled="saving">取消</el-button><el-button type="primary" @click="saveProductionImport" :loading="saving" :disabled="!productionImportSelection.length" data-testid="save-production-import">导入并保存</el-button></template>
    </el-dialog>
  </div>
  <noscript>编辑页面需要启用 JavaScript。</noscript>
</body>
</html>
