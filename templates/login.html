<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固联轻量化 - 大屏管理</title>
    <link rel="stylesheet" href="/static/css/login.css?v=20261123-3">
    <script defer src="/static/js/api.js"></script>
    <script defer src="/static/js/login.js"></script>
</head>
<body>

    <!-- 全屏背景层 -->
    <div class="bg-layer" aria-hidden="true">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>
        <div class="particle p7"></div>
        <div class="particle p8"></div>
        <div class="particle p9"></div>
        <div class="particle p10"></div>
        <div class="particle p11"></div>
        <div class="particle p12"></div>
    </div>

    <!-- 页面内容布局区（带边距） -->
    <main class="page-wrapper">
        
        <!-- 左侧视觉区 -->
        <div class="brand-area">
            <!-- 隐藏时保留视觉区占位，登录表单及标语位置保持稳定。 -->
            <div class="logo-box"{% if not show_login_logo %} style="visibility: hidden;"{% endif %}>
                <img class="brand-logo" src="/assets/gulian-logo-login.png" alt="&#22266;&#32852;&#36731;&#37327;&#21270;" width="360" height="91">
            </div>
            <h2 class="slogan">让数据<span>可视化</span>更简单</h2>
        </div>

        <!-- 右侧表单区 -->
        <div class="form-area">
            <div class="login-card">
                <div class="form-header">
                    <h1>欢迎回来</h1>
                    <p>请登录以进入大屏管理系统</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="username" name="username" aria-label="&#30331;&#24405;&#36134;&#21495;" maxlength="40" class="form-input" placeholder="登录账号" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="password" name="password" aria-label="&#23494;&#30721;" autocomplete="current-password" maxlength="128" class="form-input" placeholder="密码" required>
                            
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="&#26174;&#31034;&#23494;&#30721;" aria-pressed="false">
                                <svg aria-hidden="true" id="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg aria-hidden="true" id="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <p id="loginError" class="login-error" role="alert" tabindex="-1" hidden></p>
                    <button id="loginButton" type="submit" class="submit-btn" aria-label="&#30331;&#24405;">登 录</button>
                </form>

                <a href="/screen" class="footer-link">
                    打开大屏
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </a>
            </div>
        </div>
        
    </main>

</body>
</html>
